<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="360" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="600" fill="#1a1a1a">How Proxy Discovery connects</text>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#0288d1"/>
    </marker>
  </defs>

  <!-- CLM Server -->
  <rect x="30" y="90" width="195" height="140" rx="10" fill="#e8f4fd" stroke="#0288d1" stroke-width="2"/>
  <text x="127" y="124" text-anchor="middle" font-size="15" font-weight="600" fill="#01579b">CLM Server</text>
  <text x="127" y="150" text-anchor="middle" font-size="11.5" fill="#333">Proxy task:</text>
  <text x="127" y="168" text-anchor="middle" font-size="11.5" fill="#333">Mode, Proxy URL or</text>
  <text x="127" y="186" text-anchor="middle" font-size="11.5" fill="#333">Vendor API credentials</text>

  <!-- Corporate Proxy -->
  <rect x="283" y="90" width="195" height="140" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="380" y="124" text-anchor="middle" font-size="15" font-weight="600" fill="#8d6e00">Corporate Proxy</text>
  <text x="380" y="150" text-anchor="middle" font-size="11.5" fill="#333">Active TLS: tunnels the</text>
  <text x="380" y="168" text-anchor="middle" font-size="11.5" fill="#333">handshake to the target</text>
  <text x="380" y="186" text-anchor="middle" font-size="11.5" fill="#333">Vendor API: has its own</text>
  <text x="380" y="204" text-anchor="middle" font-size="11.5" fill="#333">inventory to report</text>

  <!-- Target -->
  <rect x="536" y="90" width="195" height="140" rx="10" fill="#f1f8e9" stroke="#689f38" stroke-width="2"/>
  <text x="634" y="124" text-anchor="middle" font-size="15" font-weight="600" fill="#33691e">Target : Port</text>
  <text x="634" y="150" text-anchor="middle" font-size="11.5" fill="#333">Active TLS mode only —</text>
  <text x="634" y="168" text-anchor="middle" font-size="11.5" fill="#333">presents its own</text>
  <text x="634" y="186" text-anchor="middle" font-size="11.5" fill="#333">certificate</text>

  <!-- Arrows: CLM <-> Proxy -->
  <line x1="227" y1="140" x2="281" y2="140" stroke="#0288d1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="281" y1="175" x2="227" y2="175" stroke="#0288d1" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Arrows: Proxy <-> Target, dashed (Active TLS only) -->
  <line x1="480" y1="140" x2="534" y2="140" stroke="#0288d1" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <line x1="534" y1="175" x2="480" y2="175" stroke="#0288d1" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <text x="380" y="260" text-anchor="middle" font-size="12.5" fill="#0288d1" font-weight="600">Active TLS: CLM &#8594; Proxy &#8594; Target (dashed hop), certificate returns the same way</text>
  <text x="380" y="280" text-anchor="middle" font-size="12.5" fill="#0288d1" font-weight="600">Vendor API: CLM &#8594; Proxy only — the proxy answers from its own stored inventory</text>

  <text x="380" y="316" text-anchor="middle" font-size="12.5" fill="#333">CLM imports whatever either mode returns into Certificates.</text>
  <text x="380" y="334" text-anchor="middle" font-size="11" fill="#777">No target is ever contacted directly in Vendor API mode.</text>
</svg>
