<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 320" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="740" height="320" fill="#ffffff"/>
  <text x="370" y="34" text-anchor="middle" font-size="19" font-weight="600" fill="#1a1a1a">How AD CS Discovery connects</text>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#0288d1"/>
    </marker>
  </defs>

  <rect x="40" y="90" width="230" height="150" rx="10" fill="#e8f4fd" stroke="#0288d1" stroke-width="2"/>
  <text x="155" y="128" text-anchor="middle" font-size="16" font-weight="600" fill="#01579b">CLM Server</text>
  <text x="155" y="154" text-anchor="middle" font-size="12.5" fill="#333">AD CS task: Domain</text>
  <text x="155" y="174" text-anchor="middle" font-size="12.5" fill="#333">Controller, Base DN,</text>
  <text x="155" y="194" text-anchor="middle" font-size="12.5" fill="#333">Bind User/Password</text>

  <rect x="470" y="90" width="230" height="150" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="585" y="128" text-anchor="middle" font-size="16" font-weight="600" fill="#8d6e00">Active Directory</text>
  <text x="585" y="154" text-anchor="middle" font-size="12.5" fill="#333">Checks the bind</text>
  <text x="585" y="174" text-anchor="middle" font-size="12.5" fill="#333">credentials over LDAP</text>
  <text x="585" y="194" text-anchor="middle" font-size="12.5" fill="#333">(TLS when ldaps://)</text>

  <line x1="272" y1="150" x2="468" y2="150" stroke="#0288d1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="370" y="132" text-anchor="middle" font-size="12.5" fill="#0288d1" font-weight="600">1. LDAP bind</text>

  <line x1="468" y1="182" x2="272" y2="182" stroke="#0288d1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="370" y="204" text-anchor="middle" font-size="12.5" fill="#0288d1" font-weight="600">2. Returns matching objects</text>
  <text x="370" y="220" text-anchor="middle" font-size="11" fill="#555">under Base DN, within selected Scopes</text>

  <text x="370" y="270" text-anchor="middle" font-size="12.5" fill="#333">3. CLM reads each object's certificate attribute and imports it into Certificates.</text>
  <text x="370" y="288" text-anchor="middle" font-size="11" fill="#777">The bind user can only see what its own AD permissions allow it to read.</text>
</svg>
