<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="460" fill="#ffffff"/>

  <!-- Title -->
  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="600" fill="#1a1a1a">How SSH-based Discovery connects to a host</text>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#0288d1"/>
    </marker>
  </defs>

  <!-- CLM Server box -->
  <rect x="40" y="130" width="230" height="150" rx="10" fill="#e8f4fd" stroke="#0288d1" stroke-width="2"/>
  <text x="155" y="168" text-anchor="middle" font-size="16" font-weight="600" fill="#01579b">CLM Server</text>
  <text x="155" y="194" text-anchor="middle" font-size="12.5" fill="#333">SSH Discovery task:</text>
  <text x="155" y="214" text-anchor="middle" font-size="12.5" fill="#333">Host, Port, Username</text>
  <text x="155" y="234" text-anchor="middle" font-size="12.5" fill="#333">Password or Private Key</text>
  <text x="155" y="254" text-anchor="middle" font-size="12.5" fill="#333">(both encrypted at rest)</text>

  <!-- Target host box -->
  <rect x="430" y="108" width="260" height="122" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="560" y="142" text-anchor="middle" font-size="16" font-weight="600" fill="#8d6e00">Target Unix/Linux Host</text>
  <text x="560" y="168" text-anchor="middle" font-size="12.5" fill="#333">Authenticates the session</text>
  <text x="560" y="188" text-anchor="middle" font-size="12.5" fill="#333">against its own SSH server</text>

  <!-- Arrow 1: CLM -> Target host (clears both boxes, horizontal, mid-gap label) -->
  <line x1="272" y1="169" x2="428" y2="169" stroke="#0288d1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="350" y="150" text-anchor="middle" font-size="12.5" fill="#0288d1" font-weight="600">1. SSH connect</text>
  <text x="350" y="186" text-anchor="middle" font-size="11" fill="#555">port 22 · password or key</text>

  <!-- Host filesystem box -->
  <rect x="430" y="288" width="260" height="122" rx="10" fill="#f1f8e9" stroke="#689f38" stroke-width="2"/>
  <text x="560" y="322" text-anchor="middle" font-size="16" font-weight="600" fill="#33691e">Host filesystem</text>
  <text x="560" y="348" text-anchor="middle" font-size="12.5" fill="#333">Matches File Formats:</text>
  <text x="560" y="368" text-anchor="middle" font-size="12" fill="#333">.pem .crt .cer .der .pfx .p12 ...</text>

  <!-- Arrow 2: Target host -> Host filesystem (clears both boxes, vertical, label to the right) -->
  <line x1="560" y1="232" x2="560" y2="286" stroke="#0288d1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="705" y="262" text-anchor="middle" font-size="12.5" fill="#0288d1" font-weight="600">2. Walk</text>
  <text x="705" y="278" text-anchor="middle" font-size="12.5" fill="#0288d1" font-weight="600">Search Path</text>

  <!-- Arrow 3: Host filesystem -> CLM Server, curving well clear of both boxes -->
  <path d="M 428 360 C 330 385, 220 360, 160 284" fill="none" stroke="#0288d1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="300" y="412" text-anchor="middle" font-size="12.5" fill="#0288d1" font-weight="600">3. Return found certificates</text>

  <!-- Caption -->
  <text x="380" y="436" text-anchor="middle" font-size="12.5" fill="#333">CLM imports the matches into Certificates and logs the run to Audit &#8594; Discovery Logs.</text>
  <text x="380" y="452" text-anchor="middle" font-size="11" fill="#777">Credentials travel only between the CLM server and the target host over SSH.</text>
</svg>
